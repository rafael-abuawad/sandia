allowBuilds:
  '@prisma/engines': false
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  prisma: false
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
ignoredBuiltDependencies:
  - '@reown/appkit'
  - bufferutil
  - keccak
  - sharp
  - unrs-resolver
  - utf-8-validate
# Supply-chain hardening (react-doctor/require-pnpm-hardening)
# minimumReleaseAge: 10080
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - oxlint
  - oxfmt
  - '@oxlint/*'
  - '@oxfmt/*'
trustPolicy: no-downgrade
# WalletConnect logger dep: later slow-redact dropped trusted-publisher evidence.
trustPolicyExclude:
  - slow-redact@0.3.2
blockExoticSubdeps: true
# Older publishes often lack modern provenance — don't block them.
trustPolicyIgnoreAfter: 525600
